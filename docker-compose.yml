services:
  postgres:
    image: postgres:16-alpine
    container_name: gamedb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-inblackm_system}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - gamedb_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-inblackm_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamedb_pgdata:
