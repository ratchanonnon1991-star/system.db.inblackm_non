name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-system.db.inblackm
  cancel-in-progress: false

jobs:
  verify:
    name: Verify system.db.inblackm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy system.db.inblackm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: 143.14.11.252
          port: 48995
          username: root
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            set -e
            cd /www/wwwroot/system.db.inblackm
            git config --global --add safe.directory /www/wwwroot/system.db.inblackm
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/InblackM/system.db.inblackm.git
            git fetch -a
            git checkout main
            git pull origin main
            export NVM_DIR="${NVM_DIR:-/www/server/nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            elif [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            nvm install 22
            nvm use 22
            npm ci
            npm run build
            command -v pm2 >/dev/null 2>&1 || npm install -g pm2
            pm2 startOrRestart ecosystem.config.cjs --only system.db.inblackm --update-env
            pm2 save
