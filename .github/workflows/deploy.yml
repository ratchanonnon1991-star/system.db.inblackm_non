name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-system-db-inblackm
  cancel-in-progress: false

jobs:
  verify:
    name: Verify system.db.inblackm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy system.db.inblackm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: 143.14.11.252
          port: 48995
          username: root
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            set -e

            APP_DIR="/www/wwwroot/system.db.inblackm"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR"

            AUTH_REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/InblackM/system.db.inblackm.git"

            # First deploy: the folder exists but was never cloned.
            if [ ! -d .git ]; then
              git init -b main
            fi

            git fetch --prune "$AUTH_REMOTE" main
            git checkout -f -B main FETCH_HEAD

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env not found — วางไฟล์ .env บนเซิร์ฟเวอร์ก่อน (ดู .env.example)"
              exit 1
            fi

            echo "--- loading nvm ---"

            NODE_VERSION="22"
            export NVM_DIR="/www/server/nvm"
            export PM2_HOME="/root/.pm2"

            # ป้องกัน environment จาก aaPanel/npm มาชนกับ NVM
            unset PREFIX
            unset NPM_CONFIG_PREFIX
            unset npm_config_prefix
            unset NPM_CONFIG_GLOBALCONFIG
            unset npm_config_globalconfig

            # NVM มีปัญหาเมื่อทำงานร่วมกับ set -e
            set +e
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            elif [ -s "$HOME/.nvm/nvm.sh" ]; then
              export NVM_DIR="$HOME/.nvm"
              . "$NVM_DIR/nvm.sh"
            fi
            set -e

            if ! command -v nvm >/dev/null 2>&1; then
              echo "ERROR: ไม่พบ NVM บนเซิร์ฟเวอร์"
              exit 1
            fi

            # ไม่แก้ .npmrc อัตโนมัติ แต่หยุดพร้อมบอกสาเหตุ
            if [ -f "$HOME/.npmrc" ] &&
               grep -Eq '^[[:space:]]*(prefix|globalconfig)[[:space:]]*=' "$HOME/.npmrc"; then
              echo "ERROR: $HOME/.npmrc มี prefix/globalconfig ซึ่งใช้ร่วมกับ NVM ไม่ได้"
              grep -nE '^[[:space:]]*(prefix|globalconfig)[[:space:]]*=' "$HOME/.npmrc"
              exit 1
            fi

            nvm install "$NODE_VERSION"
            nvm use "$NODE_VERSION"

            echo "Node version: $(node --version)"
            echo "Node path:    $(command -v node)"
            echo "NPM version:  $(npm --version)"
            echo "NPM prefix:   $(npm prefix -g)"

            PM2_BIN="$(npm prefix -g)/bin/pm2"

            if [ ! -x "$PM2_BIN" ]; then
              echo "PM2 not found in Node $NODE_VERSION — installing..."
              npm install --global pm2@latest
              hash -r
            fi

            PM2_BIN="$(npm prefix -g)/bin/pm2"

            if [ ! -x "$PM2_BIN" ]; then
              echo "ERROR: ติดตั้ง PM2 ไม่สำเร็จ"
              exit 1
            fi

            echo "PM2 path: $PM2_BIN"
            "$PM2_BIN" --version

            echo "--- npm ci ---"
            npm ci

            echo "--- build ---"
            npm run build

            echo "--- restart ---"
            "$PM2_BIN" startOrRestart ecosystem.config.cjs \
              --only system.db.inblackm,usdcodashop-sync-worker \
              --update-env

            "$PM2_BIN" save
