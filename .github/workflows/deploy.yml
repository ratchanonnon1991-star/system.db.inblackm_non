name: Deploy main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-system-db-inblackm
  cancel-in-progress: false

jobs:
  verify:
    name: Verify system.db.inblackm
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy system.db.inblackm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Run deploy script on server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: 143.14.11.252
          port: 48995
          username: root
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          script: |
            set -e

            APP_DIR="/www/wwwroot/system.db.inblackm"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR"

            AUTH_REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/InblackM/system.db.inblackm.git"

            # First deploy: the folder exists but was never cloned.
            if [ ! -d .git ]; then
              git init -b main
            fi

            git fetch --prune "$AUTH_REMOTE" main
            git checkout -f -B main FETCH_HEAD

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env not found — วางไฟล์ .env บนเซิร์ฟเวอร์ก่อน (ดู .env.example)"
              exit 1
            fi

            export NVM_DIR="${NVM_DIR:-/www/server/nvm}"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            elif [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi

            if ! command -v nvm >/dev/null 2>&1; then
              echo "ERROR: ไม่พบ NVM บนเซิร์ฟเวอร์"
              exit 1
            fi

            nvm install 22
            nvm use 22

            node --version
            npm --version

            # Global packages ของ NVM แยกกันในแต่ละ Node.js version
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found — installing PM2..."
              npm install --global pm2@latest
              hash -r
            fi

            pm2 --version

            npm ci
            npm run build

            pm2 startOrRestart ecosystem.config.cjs \
              --only system.db.inblackm \
              --update-env

            pm2 save