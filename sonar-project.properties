sonar.projectKey=inblackm_system-db-inblackm
sonar.projectName=INBLACKM System DB
sonar.sources=src,scripts
sonar.tests=tests
# scripts/ holds PM2 workers plus one-off smoke/diag tools that no suite runs,
# so they are analysed for issues but left out of the coverage figure
sonar.coverage.exclusions=scripts/**
# tests/run.mjs writes one lcov file per suite (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/*.lcov
sonar.sourceEncoding=UTF-8
