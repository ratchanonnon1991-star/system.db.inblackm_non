services:
  postgres:
    image: postgres:16-alpine
    container_name: gamedb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-inblackm_system}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - gamedb_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-inblackm_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gamedb-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-inblackm_system}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      GAMEDB_ENC_KEY: ${GAMEDB_ENC_KEY:?GAMEDB_ENC_KEY is required}
      SOCIAL_FEED_DATABASE: ${SOCIAL_FEED_DATABASE:-topup_inblackm}
      SOCIAL_FEED_INGEST_SECRET: ${SOCIAL_FEED_INGEST_SECRET:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
    ports:
      - "${APP_PORT:-4183}:4183"

volumes:
  gamedb_pgdata:
